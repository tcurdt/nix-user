name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check path:.
      - run: nix-instantiate --parse modules/profiles.nix > /dev/null
      - run: nix-instantiate --parse profiles/tcurdt.nix > /dev/null
